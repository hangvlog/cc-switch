[package]
name = "clawkit-desktop-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde_json = "1"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
